# Build, push, and keyless-sign the xenomit-orchestrator image, then notify
# xenomit-do/xenomit-deployments via a narrowly scoped workflow_dispatch token.
#
# Required org secrets (restricted to the image source repos):
#   APP_ID           GitHub App ID used to mint the dispatch token
#   APP_PRIVATE_KEY  GitHub App private key (PEM) for the same app
# The app needs `actions: write` on xenomit-do/xenomit-deployments. This source
# workflow requests only that permission, not write access to deployment files.

name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/xenomit-do/xenomit-orchestrator
  PAYLOAD_IMAGE: orchestrator

jobs:
  image:
    # main-only: push is branch-filtered; this also guards workflow_dispatch
    # runs triggered on non-main refs.
    if: github.ref == 'refs/heads/main'
    runs-on: xenomit-build
    steps:
      # Source layout: the Dockerfile expects a parent context containing
      # xenomit-orchestrator/ plus the sibling crates it path-depends on.
      - name: Checkout xenomit-orchestrator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: xenomit-orchestrator
          persist-credentials: false

      - name: Read pinned source revisions
        working-directory: xenomit-orchestrator
        run: |
          set -euo pipefail
          jq -e 'all(to_entries[]; (.key | startswith("xenomit-")) and
                 (.value | test("^[0-9a-f]{40}$")))' ci/source-pins.json
          while IFS=$'\t' read -r dep sha; do
            echo "PIN_$(echo "$dep" | tr 'a-z-' 'A-Z_')=$sha" >> "$GITHUB_ENV"
          done < <(jq -r 'to_entries[] | "\(.key)\t\(.value)"' ci/source-pins.json)

      - name: Checkout xenomit-mock-game (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: xenomit-do/xenomit-mock-game
          ref: ${{ env.PIN_XENOMIT_MOCK_GAME }}
          path: xenomit-mock-game
          persist-credentials: false

      - name: Checkout xenomit-packet-client (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: xenomit-do/xenomit-packet-client
          ref: ${{ env.PIN_XENOMIT_PACKET_CLIENT }}
          path: xenomit-packet-client
          persist-credentials: false

      - name: Checkout xenomit-backpage (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: xenomit-do/xenomit-backpage
          ref: ${{ env.PIN_XENOMIT_BACKPAGE }}
          path: xenomit-backpage
          persist-credentials: false

      - name: Checkout xenomit-game-api (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: xenomit-do/xenomit-game-api
          ref: ${{ env.PIN_XENOMIT_GAME_API }}
          path: xenomit-game-api
          persist-credentials: false

      - name: Verify checked-out revisions match pins
        run: |
          set -euo pipefail
          test "$(git -C xenomit-orchestrator rev-parse HEAD)" = "$GITHUB_SHA"
          for dep in xenomit-mock-game xenomit-packet-client xenomit-backpage xenomit-game-api; do
            var="PIN_$(echo "$dep" | tr 'a-z-' 'A-Z_')"
            actual="$(git -C "$dep" rev-parse HEAD)"
            if [ "$actual" != "${!var}" ]; then
              echo "::error::$dep at $actual, expected ${!var}"
              exit 1
            fi
          done

      - name: Allow-list the build context
        run: cp xenomit-orchestrator/ci/docker/root.dockerignore .dockerignore

      - name: Validate Cargo.lock against sibling dependencies
        working-directory: xenomit-orchestrator
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.4.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: xenomit-orchestrator/ci/docker/Dockerfile.orchestrator
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Sign image (keyless)
        run: cosign sign --yes "${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

      - name: Mint deployments dispatch token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: xenomit-do
          repositories: xenomit-deployments
          permission-actions: write

      - name: Dispatch image-published to xenomit-deployments
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          DISPATCH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          payload="$(jq -n --arg image "$PAYLOAD_IMAGE" --arg digest "$DIGEST" \
            --arg repo "${{ github.repository }}" --arg sha "$SOURCE_SHA" \
            '{ref: "main", inputs: {
              image: $image, digest: $digest,
              source_repository: $repo, source_sha: $sha}}')"
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/xenomit-do/xenomit-deployments/actions/workflows/promote-image.yml/dispatches" \
            -d "$payload")"
          test "$status" = "200"

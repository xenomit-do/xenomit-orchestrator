[package]
name = "control-gateway"
description = "tonic control-plane gateway: per-bot session stream, epoch fencing, leases, checkpoint upload into SnapshotStore"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
postgres = ["dep:sqlx"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
fleet-types.workspace = true
futures.workspace = true
hex.workspace = true
operator.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { version = "0.9", optional = true, default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "json",
    "chrono",
] }
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"

[workspace]
resolver = "3"
members = [
    "fleet-types",
    "operator",
    "control-gateway",
    "orchestrator-api",
    "orchestratord",
    "plans",
    "e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
fleet-types = { path = "fleet-types" }
operator = { path = "operator" }
control-gateway = { path = "control-gateway" }
plans = { path = "plans" }

async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
futures = "0.3"
hex = "0.4"
k8s-openapi = { version = "0.28", default-features = false, features = ["v1_32"] }
kube = { version = "4", default-features = false, features = ["derive", "rustls-tls", "ring"] }
prost = "0.14"
prost-types = "0.14"
rand = "0.8"
schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
    "net",
    "process",
    "fs",
    "io-util",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { version = "0.14", default-features = false, features = [
    "transport",
    "server",
    "router",
    "channel",
    "codegen",
] }
tonic-prost = "0.14"
tracing = "0.1"
zeroize = { version = "1", features = ["derive"] }

[profile.dev.package."*"]
opt-level = 1
